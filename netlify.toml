[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  # Vinext implements the Next.js APIs on Vite and produces a static
  # `dist/client` directory. Do not invoke Netlify's Next runtime, which
  # expects a `.next/` build generated by `next build`.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
